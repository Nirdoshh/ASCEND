<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="ASCEND">
  <title>ASCEND</title>
  <rect width="32" height="32" rx="8" fill="#4f46e5" />
  <!--
    Three ascending bars: the smallest action, repeated, becomes progress.
    Original mark for ASCEND. Not derived from any existing artwork.
  -->
  <g fill="#ffffff">
    <rect x="7" y="18" width="4" height="7" rx="2" opacity="0.55" />
    <rect x="14" y="13" width="4" height="12" rx="2" opacity="0.8" />
    <rect x="21" y="7" width="4" height="18" rx="2" />
  </g>
</svg>
